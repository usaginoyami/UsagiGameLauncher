name: Build do curador (privado)

# O curador é só seu: este workflow gera o .exe como artefato (visível só a quem tem acesso
# ao repositório) e NUNCA publica na Release. Rode manualmente em Actions > Run workflow.
# A Release pública leva apenas o cliente (release-client.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          python tests/test_core.py
          python tests/test_covers.py
          python tests/test_extras.py
          python tests/test_edition.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt pyinstaller
      - name: Gerar o .exe do curador
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name UsagiGameLauncher --add-data "data;data" main.py
      - name: Compactar
        shell: pwsh
        run: |
          Compress-Archive -Path dist/UsagiGameLauncher -DestinationPath UsagiGameLauncher-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UsagiGameLauncher-Windows-x64
          path: UsagiGameLauncher-Windows-x64.zip
          retention-days: 30
